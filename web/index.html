<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saturday afternoon</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1915;
        --paper: #fffdf8;
        --line: #1c1915;
        --health: #c23b3b;
        --happiness: #d4538a;
        --money: #2f8f4e;
        --energy: #2f5f8a;
        font-family: Georgia, "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 18rem;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 100vh;
      }
      .game, .chat, .player, .choices {
        border-color: var(--line);
        border-style: solid;
      }
      .game {
        grid-column: 1;
        grid-row: 1;
        position: relative;
        overflow: hidden;
        border-width: 0 0 2px 0;
        min-height: 18rem;
        background:
          linear-gradient(#efe8dc 1px, transparent 1px),
          linear-gradient(90deg, #efe8dc 1px, transparent 1px),
          #f7f3ec;
        background-size: 28px 28px;
      }
      .scene {
        position: absolute;
        z-index: 1;
        top: 0.7rem;
        left: 0.85rem;
        margin: 0;
        max-width: 28rem;
        line-height: 1.35;
        font-size: 0.95rem;
      }
      .sandbox { position: absolute; inset: 0; }
      .sandbox.is-paused { background: rgba(28, 25, 21, 0.05); }
      .pause {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: 0.75rem;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.3rem 0.75rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        font-size: 0.95rem;
      }
      .encounter-copy { margin: 0 0 0.7rem; line-height: 1.4; }
      .actor {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .actor .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--ink);
      }
      .actor .name { font-size: 0.75rem; }
      .player-token .dot {
        width: 18px;
        height: 18px;
        background: var(--ink);
        box-shadow: 0 0 0 7px rgba(28, 25, 21, 0.08);
      }
      .captain .dot { background: var(--energy); }
      .spark .dot { background: var(--happiness); }
      .chat {
        grid-column: 2;
        grid-row: 1 / span 2;
        border-width: 0 0 0 2px;
        padding: 1rem 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .chat h2, .player h2, .choices h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 500;
      }
      #status, #reply {
        margin: 0.8rem 0 0;
        line-height: 1.45;
      }
      #reply { white-space: pre-wrap; }
      .chat a {
        margin-top: auto;
        padding-top: 1rem;
        color: var(--ink);
      }
      .dock {
        grid-column: 1;
        grid-row: 2;
        display: grid;
        grid-template-columns: minmax(16rem, 24rem) minmax(0, 1fr);
        min-height: 15.5rem;
      }
      .player {
        border-width: 0 2px 0 0;
        padding: 0.85rem 1rem 1rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 8.5rem;
        grid-template-rows: auto 1fr;
        column-gap: 0.8rem;
      }
      .player h2 { grid-column: 1; grid-row: 1; align-self: start; }
      .stats {
        grid-column: 1;
        grid-row: 2;
        margin: 0.7rem 0 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .stat { display: flex; justify-content: space-between; gap: 1rem; }
      .stat dt, .stat dd { margin: 0; font-size: 1.05rem; }
      .stat dd { font-variant-numeric: tabular-nums; }
      .health { color: var(--health); }
      .happiness { color: var(--happiness); }
      .money { color: var(--money); }
      .energy { color: var(--energy); }
      .side {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        min-height: 0;
      }
      .icon, .inventory {
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .icon {
        height: 4.6rem;
        display: grid;
        place-items: center;
        gap: 0.1rem;
      }
      .icon span { font-size: 0.72rem; }
      .inventory {
        flex: 1;
        min-height: 6.5rem;
        display: grid;
        place-items: center;
        color: #6d675f;
        font-size: 0.95rem;
      }
      .choices {
        border-width: 0;
        padding: 0.85rem 1.1rem 1.1rem;
        display: flex;
        flex-direction: column;
      }
      .choices h2 { margin-bottom: 0.8rem; }
      .choice-list { display: flex; flex-direction: column; gap: 0.65rem; }
      button {
        font: inherit;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.85rem;
        cursor: pointer;
      }
      button strong { display: block; font-weight: 500; font-size: 1.05rem; }
      button span { display: block; margin-top: 0.15rem; color: #5c564e; font-size: 0.92rem; }
      button:hover:not(:disabled) { background: #f6f1e8; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      @media (max-width: 800px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto auto;
          height: auto;
        }
        .game { min-height: 18rem; }
        .chat {
          grid-column: 1;
          grid-row: 3;
          border-width: 2px 0 0 0;
          min-height: 14rem;
        }
        .dock { grid-template-columns: 1fr; }
        .player { border-width: 0 0 2px 0; }
      }
    </style>
  </head>
  <body>
    <section class="game" aria-label="Game">
      <p class="scene">Saturday afternoon. Arrow keys or WASD move Sam.</p>
      <p class="pause" id="pause" hidden>Paused</p>
      <div class="sandbox" id="sandbox">
        <div class="actor player-token" id="sam">
          <span class="dot"></span>
          <span class="name">Sam</span>
        </div>
        <div class="actor captain" id="captain">
          <span class="dot"></span>
          <span class="name">Captain</span>
        </div>
        <div class="actor spark" id="spark">
          <span class="dot"></span>
          <span class="name">Spark</span>
        </div>
      </div>
    </section>
    <aside class="chat" aria-label="Chat">
      <h2>Chat</h2>
      <p id="status" role="status">Captain will answer here.</p>
      <p id="reply"></p>
      <a id="playground" href="http://127.0.0.1:3000/person1/playground">Open person 1's playground</a>
    </aside>
    <div class="dock">
      <section class="player" aria-label="Player">
        <h2>Player</h2>
        <dl class="stats">
          <div class="stat health"><dt>Health</dt><dd id="health">80</dd></div>
          <div class="stat happiness"><dt>Happiness</dt><dd id="happiness">50</dd></div>
          <div class="stat money"><dt>Money</dt><dd id="money">$40</dd></div>
          <div class="stat energy"><dt>Energy</dt><dd id="energy">3/3</dd></div>
        </dl>
        <div class="side">
          <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1c1915" stroke-width="1.6">
              <circle cx="14" cy="8" r="3.2"></circle>
              <path d="M7 23c.8-4.2 3.2-6.2 7-6.2S20.2 18.8 21 23"></path>
            </svg>
            <span>Sam</span>
          </div>
          <div class="inventory">Inventory</div>
        </div>
      </section>
      <section class="choices" aria-label="Choices">
        <h2>Choices</h2>
        <div class="choice-list" id="roam-choices">
          <button id="career-fair" type="button">
            <strong>Go to the career fair</strong>
            <span>1 energy, $8</span>
          </button>
          <button id="nap" type="button">
            <strong>Take a nap</strong>
            <span>Gain 1 energy</span>
          </button>
        </div>
        <div class="choice-list" id="encounter-choices" hidden>
          <p class="encounter-copy" id="encounter-copy"></p>
          <button id="encounter-a" type="button"><strong></strong><span></span></button>
          <button id="encounter-b" type="button"><strong></strong><span></span></button>
        </div>
      </section>
    </div>
    <script>
      const careerFair = document.querySelector("#career-fair");
      const nap = document.querySelector("#nap");
      const health = document.querySelector("#health");
      const happiness = document.querySelector("#happiness");
      const money = document.querySelector("#money");
      const energy = document.querySelector("#energy");
      const status = document.querySelector("#status");
      const reply = document.querySelector("#reply");
      const playground = document.querySelector("#playground");

      let world;

      function canChooseFair(state) {
        return state.sam.energy >= 1 && state.sam.money >= 8;
      }

      function showStats(state) {
        world = state;
        health.textContent = String(state.sam.health);
        happiness.textContent = String(state.sam.happiness);
        money.textContent = `$${state.sam.money}`;
        energy.textContent = `${state.sam.energy}/${state.sam.energyMax}`;
        careerFair.disabled = !canChooseFair(state);
      }

      async function choose(eventId) {
        const fromEncounter = encounterId !== null;
        careerFair.disabled = true;
        nap.disabled = true;
        encounterA.disabled = true;
        encounterB.disabled = true;
        status.textContent = "Sending the choice… person 1 is answering.";
        reply.textContent = "";
        try {
          const response = await fetch("/choices", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ playerId: "sam", eventId }),
          });
          const result = await response.json();
          if (result.state) showStats(result.state);
          if (typeof result.playground === "string") playground.href = result.playground;
          if (result.ok && result.reply) {
            status.textContent = "Person 1 answered.";
            reply.textContent = result.reply;
          } else if (result.ok) {
            status.textContent = "Person 1 accepted the choice. Read the reply in the playground.";
          } else {
            status.textContent = result.error ?? `The agent returned ${result.agentStatus}.`;
          }
        } catch {
          status.textContent = "The page could not reach its own server.";
        } finally {
          if (fromEncounter) endEncounter();
          nap.disabled = false;
          encounterA.disabled = false;
          encounterB.disabled = false;
          if (world !== undefined) careerFair.disabled = !canChooseFair(world);
        }
      }

      careerFair.addEventListener("click", () => choose("career_fair"));
      nap.addEventListener("click", () => choose("nap"));

      const REACH = 72;
      const RELEASE = 112;
      const sandbox = document.querySelector("#sandbox");
      const pause = document.querySelector("#pause");
      const roamChoices = document.querySelector("#roam-choices");
      const encounterChoices = document.querySelector("#encounter-choices");
      const encounterCopy = document.querySelector("#encounter-copy");
      const encounterA = document.querySelector("#encounter-a");
      const encounterB = document.querySelector("#encounter-b");
      const player = { el: document.querySelector("#sam"), x: 0, y: 0, speed: 140 };
      const residents = [
        { id: "captain", name: "Captain", el: document.querySelector("#captain"), angle: 0.4, speed: 26, pause: 0 },
        { id: "spark", name: "Spark", el: document.querySelector("#spark"), angle: 2.2, speed: 34, pause: 0.4 },
      ];
      const meetings = {
        captain: {
          copy: "Captain stops you. The missed lab is still on their mind.",
          primary: { id: "captain_listen", title: "Listen", detail: "Hear them out" },
          secondary: { id: "captain_pass", title: "Keep walking", detail: "Leave the conversation" },
        },
        spark: {
          copy: "Spark catches you and wants to talk.",
          primary: { id: "spark_talk", title: "Talk", detail: "Stay for a minute" },
          secondary: { id: "spark_later", title: "Not now", detail: "Leave the conversation" },
        },
      };
      let encounterId = null;
      const cooled = new Set();

      function labelChoice(button, choice) {
        button.querySelector("strong").textContent = choice.title;
        button.querySelector("span").textContent = choice.detail;
      }

      function startEncounter(id) {
        const meeting = meetings[id];
        encounterId = id;
        held.clear();
        sandbox.classList.add("is-paused");
        pause.hidden = false;
        pause.textContent = "Paused";
        roamChoices.hidden = true;
        encounterChoices.hidden = false;
        encounterCopy.textContent = meeting.copy;
        labelChoice(encounterA, meeting.primary);
        labelChoice(encounterB, meeting.secondary);
      }

      function endEncounter() {
        if (encounterId !== null) cooled.add(encounterId);
        encounterId = null;
        sandbox.classList.remove("is-paused");
        pause.hidden = true;
        roamChoices.hidden = false;
        encounterChoices.hidden = true;
      }

      function checkProximity() {
        let closest = null;
        for (const resident of residents) {
          const dist = Math.hypot(player.x - resident.x, player.y - resident.y);
          if (dist > RELEASE) cooled.delete(resident.id);
          if (dist <= REACH && !cooled.has(resident.id) && (closest === null || dist < closest.dist)) {
            closest = { id: resident.id, dist };
          }
        }
        if (closest !== null) startEncounter(closest.id);
      }

      encounterA.addEventListener("click", () => {
        if (encounterId === null) return;
        choose(meetings[encounterId].primary.id);
      });
      encounterB.addEventListener("click", () => {
        if (encounterId === null) return;
        choose(meetings[encounterId].secondary.id);
      });
      const held = new Set();
      const keyDir = {
        arrowup: [0, -1],
        w: [0, -1],
        arrowdown: [0, 1],
        s: [0, 1],
        arrowleft: [-1, 0],
        a: [-1, 0],
        arrowright: [1, 0],
        d: [1, 0],
      };

      function placeResidents() {
        const width = sandbox.clientWidth;
        const height = sandbox.clientHeight;
        player.x = width * 0.5;
        player.y = height * 0.5;
        residents[0].x = width * 0.32;
        residents[0].y = height * 0.62;
        residents[1].x = width * 0.7;
        residents[1].y = height * 0.38;
      }

      function stepPlayer(dt, width, height) {
        let dx = 0;
        let dy = 0;
        for (const name of held) {
          const dir = keyDir[name];
          if (dir === undefined) continue;
          dx += dir[0];
          dy += dir[1];
        }
        if (dx !== 0 || dy !== 0) {
          const length = Math.hypot(dx, dy);
          player.x += (dx / length) * player.speed * dt;
          player.y += (dy / length) * player.speed * dt;
        }
        const margin = 36;
        player.x = Math.max(margin, Math.min(width - margin, player.x));
        player.y = Math.max(margin, Math.min(height - margin, player.y));
        player.el.style.left = `${player.x}px`;
        player.el.style.top = `${player.y}px`;
      }

      function stepResident(resident, dt, width, height) {
        const margin = 36;
        if (resident.pause > 0) {
          resident.pause -= dt;
        } else {
          resident.x += Math.cos(resident.angle) * resident.speed * dt;
          resident.y += Math.sin(resident.angle) * resident.speed * dt;
          if (Math.random() < dt * 0.45) resident.angle += (Math.random() - 0.5) * 1.2;
          if (Math.random() < dt * 0.12) resident.pause = 0.4 + Math.random() * 1.2;
        }
        if (resident.x < margin || resident.x > width - margin) {
          resident.angle = Math.PI - resident.angle;
          resident.x = Math.max(margin, Math.min(width - margin, resident.x));
        }
        if (resident.y < margin || resident.y > height - margin) {
          resident.angle = -resident.angle;
          resident.y = Math.max(margin, Math.min(height - margin, resident.y));
        }
        resident.el.style.left = `${resident.x}px`;
        resident.el.style.top = `${resident.y}px`;
      }

      placeResidents();
      let last = performance.now();
      function tick(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const width = sandbox.clientWidth;
        const height = sandbox.clientHeight;
        if (encounterId === null) {
          stepPlayer(dt, width, height);
          for (const resident of residents) stepResident(resident, dt, width, height);
          checkProximity();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      window.addEventListener("resize", () => {
        const width = sandbox.clientWidth;
        const height = sandbox.clientHeight;
        player.x = Math.max(36, Math.min(width - 36, player.x));
        player.y = Math.max(36, Math.min(height - 36, player.y));
        for (const resident of residents) {
          resident.x = Math.max(36, Math.min(width - 36, resident.x));
          resident.y = Math.max(36, Math.min(height - 36, resident.y));
        }
      });
      window.addEventListener("keydown", (event) => {
        const name = event.key.toLowerCase();
        if (keyDir[name] === undefined) return;
        held.add(name);
        event.preventDefault();
      });
      window.addEventListener("keyup", (event) => {
        held.delete(event.key.toLowerCase());
      });
      window.addEventListener("blur", () => held.clear());
      fetch("/state")
        .then((response) => response.json())
        .then((result) => showStats(result.state));
    </script>
  </body>
</html>
