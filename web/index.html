<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career fair choice</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4efe6;
        color: #1c1915;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        background: #fffdf8;
        border: 1px solid #ded4c4;
        border-radius: 12px;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.45;
      }
      button {
        font: inherit;
        font-size: 1rem;
        background: #1c1915;
        color: #fffdf8;
        border: 0;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        cursor: pointer;
        margin: 0 0.4rem 0 0;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #status,
      #reply {
        min-height: 1.4rem;
        margin: 1rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Saturday afternoon</h1>
      <p id="stats"></p>
      <p>The career fair costs 1 energy and $8. Sam misses chemistry lab and meets a recruiter. A nap gives 1 energy back.</p>
      <button id="career-fair" type="button">Go to the career fair</button>
      <button id="nap" type="button">Take a nap</button>
      <p id="status" role="status"></p>
      <p id="reply"></p>
      <p><a id="playground" href="http://127.0.0.1:3000/person1/playground">Open person 1's playground</a></p>
    </main>
    <script>
      const careerFair = document.querySelector("#career-fair");
      const nap = document.querySelector("#nap");
      const stats = document.querySelector("#stats");
      const status = document.querySelector("#status");
      const reply = document.querySelector("#reply");
      const playground = document.querySelector("#playground");

      let world;

      function showStats(state) {
        world = state;
        stats.textContent = `Sam happiness ${state.sam.happiness}, money $${state.sam.money}, energy ${state.sam.energy}/${state.sam.energyMax}. Captain happiness ${state.person1.happiness}, money $${state.person1.money}. Spark happiness ${state.person2.happiness}, money $${state.person2.money}.`;
        careerFair.disabled = state.sam.energy < 1 || state.sam.money < 8;
      }

      async function choose(eventId) {
        careerFair.disabled = true;
        nap.disabled = true;
        status.textContent = "Sending the choice… person 1 is answering.";
        reply.textContent = "";
        try {
          const response = await fetch("/choices", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ playerId: "sam", eventId }),
          });
          const result = await response.json();
          if (result.state) showStats(result.state);
          if (typeof result.playground === "string") playground.href = result.playground;
          if (result.ok && result.reply) {
            status.textContent = "Person 1 answered.";
            reply.textContent = result.reply;
          } else if (result.ok) {
            status.textContent = "Person 1 accepted the choice. Read the reply in the playground.";
          } else {
            status.textContent = result.error ?? `The agent returned ${result.agentStatus}.`;
          }
        } catch {
          status.textContent = "The page could not reach its own server.";
        } finally {
          nap.disabled = false;
          careerFair.disabled = world !== undefined && (world.sam.energy < 1 || world.sam.money < 8);
        }
      }

      careerFair.addEventListener("click", () => choose("career_fair"));
      nap.addEventListener("click", () => choose("nap"));
      fetch("/state")
        .then((response) => response.json())
        .then((result) => showStats(result.state));
    </script>
  </body>
</html>
